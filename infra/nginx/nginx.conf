# -----------------------------------------------------------------------------
# Nginx — API Gateway de ZonaVip (Entrega 2)
#
# Punto único de entrada (fachada) que enruta el tráfico según la URL hacia el
# monolito o hacia cada microservicio estrangulado:
#
#   /api/v2/qr/           -> microservicio Flask de QR          (Entrega 1)
#   /api/v2/integracion/  -> microservicio Flask de Integración (Entrega 2)
#   /                     -> monolito Django (frontend, API /api/v1/, admin)
#
# A medida que se estrangulan más módulos, se agregan más `location` apuntando
# a nuevos upstreams, sin tocar el monolito. Ver
# docs/wiki/06-Entrega2-Integracion-y-Resiliencia.md
# -----------------------------------------------------------------------------

# Upstreams: nombres de servicio resueltos por la red interna de Docker Compose.
upstream django_web {
    server django_web:8000;
}

upstream flask_qr_service {
    server flask_qr_service:5000;
}

upstream flask_integracion {
    server flask_integracion:5001;
}

server {
    listen 80;
    server_name _;

    # Seguridad y límites de carga
    server_tokens off;
    client_max_body_size 20M;

    # Compresión gzip para estáticos y respuestas JSON/HTML
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Cabeceras estándar reenviadas a todos los backends.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # -------------------------------------------------------------------------
    # ARCHIVOS ESTÁTICOS Y MULTIMEDIA (servidos directo por Nginx en producción)
    # -------------------------------------------------------------------------
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # -------------------------------------------------------------------------
    # RUTAS ESTRANGULADAS -> microservicios Flask.
    # Se declaran ANTES del `location /` para que tengan prioridad.
    # -------------------------------------------------------------------------
    location /api/v2/qr/ {
        proxy_pass http://flask_qr_service;
    }

    location /api/v2/integracion/ {
        proxy_pass http://flask_integracion;
    }

    # -------------------------------------------------------------------------
    # MONOLITO DJANGO -> frontend, API versionada (/api/v1/), admin
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://django_web;
    }
}
