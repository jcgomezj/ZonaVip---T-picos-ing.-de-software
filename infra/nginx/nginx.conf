# -----------------------------------------------------------------------------
# Nginx — Orquestación de tráfico del Strangler Pattern (ZonaVip)
#
# Punto único de entrada (fachada) que bifurca el tráfico según la URL:
#
#   /api/v2/qr/  -> microservicio Flask (funcionalidad ESTRANGULADA)
#   /            -> monolito Django      (todo lo demás, incluido /api/v1/)
#
# A medida que se estrangulen más módulos, se agregan más bloques `location`
# apuntando a nuevos upstreams, sin tocar el monolito. Ver
# docs/wiki/05-Migracion-a-Microservicios.md
# -----------------------------------------------------------------------------

# Upstreams: nombres de servicio resueltos por la red interna de Docker Compose.
upstream django_web {
    server django_web:8000;
}

upstream flask_qr_service {
    server flask_qr_service:5000;
}

server {
    listen 80;
    server_name _;

    # Cabeceras estándar reenviadas a ambos backends.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # -------------------------------------------------------------------------
    # RUTA ESTRANGULADA -> Flask
    # Debe declararse ANTES del `location /` para que tenga prioridad.
    # -------------------------------------------------------------------------
    location /api/v2/qr/ {
        proxy_pass http://flask_qr_service;
    }

    # -------------------------------------------------------------------------
    # MONOLITO LEGACY -> Django
    # Atiende el catálogo, boletas, admin y las rutas antiguas /api/v1/.
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://django_web;
    }
}
